<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="what the dog doing - Team Showcase Website">
    <title>Daily Homework - what the dog doing</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="../../index.html" class="logo">what the dog doing</a>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../../assets/about-us/index.html">About us</a></li>
                <li><a href="index.html" class="active">Daily Homework</a></li>
                <li><a href="../../assets/final-project/index.html">Final Project</a></li>
            </ul>
        </div>
    </nav>

    <!-- Scroll to Top Button -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="Back to Top">
        ↑
    </button>

    <!-- Main Content Area -->
    <main class="main-content">
        <section id="exercises" class="page-section active">
            <h2 class="page-title">Daily Homework</h2>
            <div class="page-description">
                A series of exercise projects we completed during the course, showcasing our learning outcomes and technical practices.
            </div>

            <div id="exercises-list">
                <!-- Exercise list will be dynamically generated by JavaScript -->
            </div>
        </section>
    </main>
    
    <script>
        // ===== 滚动到顶部 =====
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== 滚动处理（导航栏隐藏 + 置顶按钮） =====
        let lastScrollY = window.scrollY;
        let ticking = false;

        function initScrollHandlers() {
            const navbar = document.querySelector('.navbar');
            const backToTopBtn = document.getElementById('backToTop');

            if (!navbar || !backToTopBtn) return;

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const currentScrollY = window.scrollY;

                        if (currentScrollY > lastScrollY && currentScrollY > 100) {
                            navbar.classList.add('hidden');
                        } else {
                            navbar.classList.remove('hidden');
                        }

                        if (currentScrollY > 500) {
                            backToTopBtn.classList.add('visible');
                        } else {
                            backToTopBtn.classList.remove('visible');
                        }

                        lastScrollY = currentScrollY;
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        }

        const exercises = [
            {
                id: 0,
                title: 'Project Management',
                description: 'We have created a webpage for storing daily and final assignments',
                content: ''
            },
            {
                id: 1,
                title: 'Arduino Basic',
                description: 'Learn basic Arduino input and output operations, including button detection and LED control.',
                content: 'In this exercise, we learned how to use Arduino to read digital input from buttons and control digital output to LEDs. Key concepts included:\n\n• Digital pin configuration (INPUT/OUTPUT)\n• Pull-up and pull-down resistors\n• Button debouncing\n• LED brightness control with PWM\n• Serial monitor for debugging\n\nComponents used: Arduino Uno, breadboard, jumper wires, push buttons, LEDs, resistors.'
            },
            {
                id: 2,
                title: 'Arduino Output&Input',
                description: 'Use various sensors to collect environmental data and perform initial processing.',
                content: 'Do one project which contain switch, sensor(photosensitive sensor, temperature ,etc);\nBuild one environment monitoring device'
            },
            {
                id: 3,
                title: 'CAD Design',
                description: 'Learning about model design through CAD design',
                content: 'Further design the existing model through AI and fusion360.'
            },
            {
                id: 4,
                title: '3D Printing',
                description: 'Explore 3D printing technology and create physical models from digital designs.',
                content: ''
            },
            {
                id: 5,
                title: 'Material',
                description: 'BMW TCB Remote Communication Control Unit (IoT Core Device)',
                content: ''
            },
        ];

        // ===== 渲染练习列表 =====
        function renderExercises() {
            const list = document.getElementById('exercises-list');
            list.innerHTML = exercises.map((exercise) => `
                <a href="./assignment-${exercise.id}/index.html" class="exercise-card-link" style="text-decoration: none; color: inherit;">
                    <div class="exercise-card" style="cursor: pointer; transition: all 0.3s ease;">
                        <h3>Exercise ${exercise.id + 1}: ${exercise.title}</h3>
                        <p style="color: rgba(255, 255, 255, 0.7); margin: 0.5rem 0;">${exercise.description}</p>
                        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                            <span style="color: #00d4ff;">Click to view details →</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            // 只在 exercises-list 存在时渲染练习列表
            if (document.getElementById('exercises-list')) {
                renderExercises();
            }
            initScrollHandlers();
        });
</script>
</body>
</html>
