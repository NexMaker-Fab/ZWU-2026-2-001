        function initScrollHandlers() {
            const navbar = document.querySelector('.navbar');
            const backToTopBtn = document.getElementById('backToTop');

            if (!navbar || !backToTopBtn) return;

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const currentScrollY = window.scrollY;

                        if (currentScrollY > lastScrollY && currentScrollY > 100) {
                            navbar.classList.add('hidden');
                        } else {
                            navbar.classList.remove('hidden');
                        }

                        if (currentScrollY > 500) {
                            backToTopBtn.classList.add('visible');
                        } else {
                            backToTopBtn.classList.remove('visible');
                        }

                        lastScrollY = currentScrollY;
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        }

function generateDetailedTOC(exerciseId) {

    tocHTML += '&lt;li&gt;&lt;a href="#section-homework" class="active"&gt;Assignment Content&lt;/a&gt;&lt;/li&gt;';
    
    headings.forEach((heading, index) =&gt; {
        const level = heading.tagName === 'H4' ? '' : 'toc-sub';
        const text = heading.textContent.trim();
        const id = heading.id || 'section-heading-' + index;
        
        if (!heading.id) {
            heading.id = id;
        }
        
        tocHTML += '&lt;li class="' + level + '"&gt;&lt;a href="#' + id + '"&gt;' + text + '&lt;/a&gt;&lt;/li&gt;';
    });
    
    tocList.innerHTML = tocHTML;
    setupScrollSpy();
}</code></pre>

                                <h4 id="section-ehmi" style="color: #00d4ff; margin: 2rem 0 1rem 0;">B. Autonomous Vehicle eHMI Prototype</h4>

                                <h4 id="section-harmoware" style="color: #00d4ff; margin: 2rem 0 1rem 0;">C. Harmoware-HMI</h4>

                    <!-- Assignment Content -->
                    <div class="homework-content-section" style="margin-bottom: 3rem;">
                        <h3 id="section-assignment" style="font-size: 1.5rem; margin-bottom: 1rem; color: #00d4ff;">Assignment Content</h3>
                        <div style="color: rgba(255, 255, 255, 0.8); line-height: 1.8; padding: 1.5rem; background: rgba(255, 255, 255, 0.03); border-radius: 12px;">
                            <h4 id="section-title" style="color: #00d4ff; margin-bottom: 1rem;">📄 Arduino Output&Input - Interactive Visualization Project</h4>
                            
                            <div style="margin-top: 2rem;">
                                <h4 id="section-introduction" style="color: #00d4ff; margin: 1.5rem 0 1rem 0;">1. Project Introduction</h4>
                                <p>Implemented by Arduino R4 WiFi board, OLED screen, RFID RF module (MFRC522), and WS2812 LED strip. This program can recognize the UID of different cards and respond accordingly. Therefore, different feedback can be obtained by scanning different cards. As our final task is to design an autonomous driving interaction signal system for the elderly (or other special groups), we have currently created cards and interactions corresponding to the elderly</p>
                                
                                <h4 id="section-code" style="color: #00d4ff; margin: 2rem 0 1rem 0;">2. Code</h4>
                                <div style="background: rgba(0, 212, 255, 0.05); border-radius: 8px; padding: 1.5rem; margin: 1rem 0; border: 1px solid rgba(0, 212, 255, 0.2); max-height: 600px; overflow-y: auto;">
                                    <pre style="margin: 0; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.8rem; line-height: 1.6; color: rgba(255, 255, 255, 0.9); white-space: pre-wrap; word-wrap: break-word;"><code>// ==================== 老人卡专用代码 ====================
// 功能：RFID识别老人卡 -&gt; OLED显示动画 + LED灯带红色旋转效果
// 连线：
//   OLED (I2C): SDA-&gt;A4, SCL-&gt;A5 (UNO)
//   RFID:      SS-&gt;10, RST-&gt;9, MOSI-&gt;11, MISO-&gt;12, SCK-&gt;13
//   LED灯带:   DATA-&gt;6

#include &lt;Wire.h&gt;
#include &lt;Adafruit_GFX.h&gt;
#include &lt;Adafruit_SSD1306.h&gt;
#include &lt;SPI.h&gt;
#include &lt;MFRC522.h&gt;
#include &lt;Adafruit_NeoPixel.h&gt;

// ---------- OLED 配置 ----------
#define SCREEN_WIDTH 128
#define SCREEN_HEIGHT 64
#define OLED_RESET -1
#define SCREEN_ADDRESS 0x3C
Adafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &amp;Wire, OLED_RESET);

// ---------- RFID 配置 ----------
#define RST_PIN 9
#define SS_PIN 10
MFRC522 mfrc522(SS_PIN, RST_PIN);

// ---------- LED灯带配置 ----------
#define LED_PIN 6
#define LED_COUNT 60
Adafruit_NeoPixel strip(LED_COUNT, LED_PIN, NEO_GRB + NEO_KHZ800);

// ---------- 老人卡UID ----------
byte seniorCardUID[] = {0x32, 0x49, 0xCF, 0x06};

// ---------- 状态与动画变量 ----------
bool seniorCardDetected = false;      // 是否检测到老人卡
unsigned long cardDetectedTime = 0;   // 检测到卡的时间
unsigned long lastAnimationUpdate = 0;
unsigned long lastLedUpdate = 0;
const unsigned long ANIMATION_INTERVAL = 100;  // 动画更新间隔
const unsigned long LED_INTERVAL = 50;         // LED更新间隔
int animationFrame = 0;
int rotatingPosition = 0;

// ---------- 函数声明 ----------
bool compareUID(byte* uid1, byte* uid2, int length);
void updateAnimation();
void drawSeniorCardAnimation();
void drawSmallCard(int x, int y);
void drawMiniSenior(int x, int y);
void updateLEDs();
void rotatingEffect(int r, int g, int b);

// ==================== 初始化 ====================
void setup() {
  Serial.begin(115200);

  // 初始化OLED
  if(!display.begin(SSD1306_SWITCHCAPVCC, SCREEN_ADDRESS)) {
    Serial.println(F("OLED初始化失败"));
    for(;;);
  }
  display.clearDisplay();
  display.setTextColor(SSD1306_WHITE);
  display.cp437(true);
  display.display();

  // 初始化RFID
  SPI.begin();
  mfrc522.PCD_Init();

  // 初始化LED灯带
  strip.begin();
  strip.show();
  strip.setBrightness(50);

  Serial.println(F("老人卡系统就绪 - 请刷老人卡"));
}

// ==================== 主循环 ====================
void loop() {
  // 1. 检测老人卡
  checkForSeniorCard();

  // 2. 更新OLED动画（非阻塞）
  if (millis() - lastAnimationUpdate &gt;= ANIMATION_INTERVAL) {
    lastAnimationUpdate = millis();
    updateAnimation();
  }

  // 3. 更新LED灯带效果（非阻塞）
  if (millis() - lastLedUpdate &gt;= LED_INTERVAL) {
    lastLedUpdate = millis();
    updateLEDs();
  }

  // 4. 检测到老人卡后，5秒自动清除显示（超时可调）
  if (seniorCardDetected &amp;&amp; (millis() - cardDetectedTime &gt; 5000)) {
    seniorCardDetected = false;
  }
}

// ==================== 老人卡检测 ====================
void checkForSeniorCard() {
  if (!mfrc522.PICC_IsNewCardPresent()) return;
  if (!mfrc522.PICC_ReadCardSerial()) return;

  // 比较是否为老人卡
  if (compareUID(mfrc522.uid.uidByte, seniorCardUID, 4)) {
    seniorCardDetected = true;
    cardDetectedTime = millis();
    Serial.println(F("检测到老人卡！"));
  }

  mfrc522.PICC_HaltA();
}

// ==================== UID比较 ====================
bool compareUID(byte* uid1, byte* uid2, int length) {
  for (int i = 0; i &lt; length; i++) {
    if (uid1[i] != uid2[i]) return false;
  }
  return true;
}

// ==================== OLED动画更新 ====================
void updateAnimation() {
  display.clearDisplay();
  if (seniorCardDetected) {
    drawSeniorCardAnimation();   // 显示老人卡动画
  } else {
    drawNoCardAnimation();       // 待机动画：摆动卡片 + 提示
  }
  display.display();
  animationFrame++;
}

// 老人图标（带拐杖和行走动画）
void drawMiniSenior(int x, int y) {
  int animPhase = animationFrame % 20;
  display.fillRect(x - 2, y - 2, 5, 2, SSD1306_WHITE);
  display.fillCircle(x, y + 2, 3, SSD1306_WHITE);
  display.fillRect(x - 1, y + 1, 1, 1, SSD1306_BLACK);
  display.fillRect(x + 1, y + 1, 1, 1, SSD1306_BLACK);
  display.drawLine(x - 1, y + 3, x + 1, y + 3, SSD1306_BLACK);
  display.fillRect(x - 3, y + 5, 7, 8, SSD1306_WHITE);

  // 手臂摆动
  if (animPhase &lt; 10) {
    display.fillRect(x - 5, y + 6, 3, 2, SSD1306_WHITE);
    display.fillRect(x + 3, y + 6, 3, 2, SSD1306_WHITE);
  } else {
    display.fillRect(x - 5, y + 8, 3, 2, SSD1306_WHITE);
    display.fillRect(x + 3, y + 8, 3, 2, SSD1306_WHITE);
  }
  // 腿步
  if (animPhase &lt; 10) {
    display.fillRect(x - 2, y + 13, 2, 4, SSD1306_WHITE);
    display.fillRect(x + 1, y + 13, 2, 4, SSD1306_WHITE);
  } else {
    display.fillRect(x - 3, y + 13, 2, 4, SSD1306_WHITE);
    display.fillRect(x + 2, y + 13, 2, 4, SSD1306_WHITE);
  }
  // 拐杖
  if (animPhase &lt; 10) {
    display.fillRect(x - 6, y + 5, 2, 6, SSD1306_WHITE);
    display.fillRect(x - 7, y + 10, 4, 2, SSD1306_WHITE);
  } else {
    display.fillRect(x - 7, y + 3, 2, 6, SSD1306_WHITE);
    display.fillRect(x - 8, y + 8, 4, 2, SSD1306_WHITE);
  }
  display.drawLine(x - 1, y + 5, x + 1, y + 5, SSD1306_BLACK);
}

// ==================== LED灯带效果（老人卡 = 红色旋转） ====================
void updateLEDs() {
  if (seniorCardDetected) {
    // 老人卡激活时：红色旋转效果
    rotatingEffect(255, 0, 0);
  } else {
    // 待机：呼吸灯效果（柔和白色）
    breathingEffect();
  }
  strip.show();
}

// 红色旋转效果（老人卡专用）
void rotatingEffect(int r, int g, int b) {
  rotatingPosition = (rotatingPosition + 2) % LED_COUNT;
  // 清空所有LED
  for (int i = 0; i &lt; LED_COUNT; i++) strip.setPixelColor(i, 0);
  // 主光带
  for (int i = 0; i &lt; 12; i++) {
    int pos = (rotatingPosition - i + LED_COUNT) % LED_COUNT;
    int brightness = 255 - (i * 20);
    if (brightness &lt; 0) brightness = 0;
    int currentR = (r * brightness) / 255;
    int currentG = (g * brightness) / 255;
    int currentB = (b * brightness) / 255;
    strip.setPixelColor(pos, strip.Color(currentR, currentG, currentB));
  }
  // 对称光带（增加视觉丰富度）
  int secondPos = (rotatingPosition + LED_COUNT/2) % LED_COUNT;
  for (int i = 0; i &lt; 12; i++) {
    int pos = (secondPos - i + LED_COUNT) % LED_COUNT;
    int brightness = 255 - (i * 20);
    if (brightness &lt; 0) brightness = 0;
    int currentR = (r * brightness) / 255;
    int currentG = (g * brightness) / 255;
    int currentB = (b * brightness) / 255;
    uint32_t existing = strip.getPixelColor(pos);
    if (existing == 0) {
      strip.setPixelColor(pos, strip.Color(currentR, currentG, currentB));
    } else {
      int er = (existing &gt;&gt; 16) &amp; 0xFF;
      int eg = (existing &gt;&gt; 8) &amp; 0xFF;
      int eb = existing &amp; 0xFF;
      strip.setPixelColor(pos, strip.Color(max(er, currentR), max(eg, currentG), max(eb, currentB)));
    }
  }
}

// 呼吸灯效果（待机）
void breathingEffect() {
  static int brightness = 0;
  static int direction = 1;
  brightness += direction * 3;
  if (brightness &gt;= 150) direction = -1;
  if (brightness &lt;= 0) direction = 1;
  for (int i = 0; i &lt; LED_COUNT; i++) {
    strip.setPixelColor(i, strip.Color(brightness, brightness, brightness));
  }

import adsk.core, adsk.fusion, adsk.cam, traceback


def run(context):
    ui = None
    try:
        app = adsk.core.Application.get()
        ui  = app.userInterface
        design = app.activeProduct
        
        # 获取根组件
        rootComp = design.rootComponent
        features = rootComp.features
        extrudes = features.extrudeFeatures
        
        # ================= 配置参数（单位：厘米） =================
        seat_w = 4.2      # 座椅总总宽
        seat_d = 4.0      # 座垫总深
        base_h = 0.8      # 座垫厚度
        back_h = 5.5      # 靠背高度
        wing_w = 0.5      # 赛车座椅两侧包裹侧翼的宽度
        wing_h = 1.2      # 侧翼翘起高度
        
        # 座椅在小车中的中心坐标位置（可根据需要微调）
        cx = 0.0
        cy = 0.0
        cz = 1.5 
        # =========================================================

        # 创建新组件
        allOccs = rootComp.occurrences
        newOcc = allOccs.addNewComponent(adsk.core.Matrix3D.create())
        seatComp = newOcc.component
        seatComp.name = "Racing_Bucket_Seat"
        
        sketches = seatComp.sketches
        xyPlane = seatComp.xYConstructionPlane
        xzPlane = seatComp.xZConstructionPlane
        
        # 1. 绘制带有两侧包围（桶椅底座）的草图
        sketch_base = sketches.add(xyPlane)
        lines = sketch_base.sketchCurves.sketchLines
        
        # 绘制主座垫矩形
        lines.addTwoPointRectangle(
            adsk.core.Point3D.create(cx - seat_w/2, cy - seat_d/2, cz),
            adsk.core.Point3D.create(cx + seat_w/2, cy + seat_d/2, cz)
        )
        # 内部画两条线，用来区分"主体底座"和"两侧包裹翼"
        lines.addTwoPointRectangle(
            adsk.core.Point3D.create(cx - seat_w/2 + wing_w, cy - seat_d/2, cz),
            adsk.core.Point3D.create(cx + seat_w/2 - wing_w, cy + seat_d/2, cz)
        )
        
        # 拉伸主座垫
        prof_main = sketch_base.profiles.item(0) # 对应中间主体部分
        extInput1 = seatComp.features.extrudeFeatures.createInput(prof_main, adsk.fusion.FeatureOperations.NewBodyFeatureOperation)
        extInput1.setDistanceExtent(False, adsk.core.ValueInput.createByReal(base_h))
        seatBodyFeat = extrudes.add(extInput1)
        seatBody = seatBodyFeat.bodies.item(0)
        
        # 拉伸两侧的赛车防滚包裹侧翼（多拉伸出一点高度）
        for i in range(sketch_base.profiles.count):
            prof = sketch_base.profiles.item(i)
            # 自动识别两侧区域进行加高拉伸
            if prof.areaProperties().area < (seat_w * seat_d * 0.3):
                extInput_wing = extrudes.createInput(prof, adsk.fusion.FeatureOperations.JoinFeatureOperation)
                extInput_wing.setDistanceExtent(False, adsk.core.ValueInput.createByReal(base_h + wing_h))
                extrudes.add(extInput_wing)

        # 2. 绘制赛车椅靠背（侧面视角，带倾斜感）
        sketch_back = sketches.add(xzPlane)
        back_lines = sketch_back.sketchCurves.sketchLines
        
        # 靠背起点在座垫后部
        back_start_y = cy - seat_d/2
        
        # 在 XZ 截面上绘制有动感线条的靠背厚度矩形
        rec_back = back_lines.addTwoPointRectangle(
            adsk.core.Point3D.create(cx - seat_w/2, cz + base_h),
            adsk.core.Point3D.create(cx + seat_w/2, cz + base_h + back_h)
        )
        
        # 将靠背向后拉伸（赛车椅厚度）
        prof_back = sketch_back.profiles.item(0)
        extInput2 = extrudes.createInput(prof_back, adsk.fusion.FeatureOperations.JoinFeatureOperation)
        extInput2.setDistanceExtent(False, adsk.core.ValueInput.createByReal(0.8)) # 靠背厚度 8mm
        extrudes.add(extInput2)
        
        # 3. 自动为赛车桶椅添加人体工学圆角（Fillet）
        fillets = seatComp.features.filletFeatures
        edgeCollection = adsk.core.ObjectCollection.create()
        
        # 选中座椅顶部的边缘使其圆润，模仿赛车头枕
        for edge in seatBody.edges:
            if abs(edge.startVertex.geometry.z - (cz + base_h + back_h)) < 0.1:
                edgeCollection.add(edge)
                
        if edgeCollection.count > 0:
            filletInput = fillets.createInput()
            filletInput.addRadiusEdgeSet(edgeCollection, adsk.core.ValueInput.createByReal(0.6), True)
            fillets.add(filletInput)
            
        ui.messageBox('赛车造型桶椅（Racing Bucket Seat）已成功组装到车舱中央！')
        
    except:
        if ui:
            ui.messageBox('运行失败:\n{}'.format(traceback.format_exc()))

                    link.classList.remove('active');
                    if (link.getAttribute('href') === `#${current}`) {
                        link.classList.add('active');
                    }
                });
            });
        }

        // ===== 平滑滚动到指定章节 =====
        function scrollToSection(event, sectionId) {
            event.preventDefault();
            const section = document.getElementById(sectionId);
            if (section) {
                const offsetTop = section.offsetTop - 100; // 减去导航栏高度
                window.scrollTo({
                    top: offsetTop,
                    behavior: 'smooth'
                });
                
                // 更新 URL hash（不触发页面跳转）
                history.pushState(null, null, `#${sectionId}`);
            }
        }



        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            // 只在 exercises-list 存在时渲染练习列表
            if (document.getElementById('exercises-list')) {
                renderExercises();
            }
            initScrollHandlers();
        });
</script>
</body>
</html>
