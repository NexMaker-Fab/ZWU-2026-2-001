name: Sync Homework Edits

on:
  push:
    branches:
      - homework-edits
    paths:
      - 'data/homework.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Merge to main branch
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          git checkout main
          git merge homework-edits --no-edit
          git push origin main
      
      - name: Notify completion
        run: echo "✅ Homework data synced to main branch"
