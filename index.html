<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="what the dog doing - Team Showcase Website">
    <title>Home - what the dog doing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script>
        // GitHub synchronization function moved to the script tag at the bottom
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">what the dog doing</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="assets/about-us/index.html">About us</a></li>
                <li><a href="assets/dailyhomework/index.html">Daily Homework</a></li>
                <li><a href="assets/final-project/index.html">Final Project</a></li>
            </ul>
        </div>
    </nav>
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="Back to Top">
        ↑
    </button>
    
    <main class="main-content">
        <section id="home" class="page-section hero active">
            <div class="hero-content">
                <h1>Welcome to our team's web page!</h1>
                <div class="team-name">what the dog doing</div>
            </div>
        </section>
    </main>
    
    <script>
        // ===== 滚动到顶部 =====
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== 滚动处理（导航栏隐藏 + 置顶按钮） =====
        let lastScrollY = window.scrollY;
        let ticking = false;

        function initScrollHandlers() {
            const navbar = document.querySelector('.navbar');
            const backToTopBtn = document.getElementById('backToTop');

            if (!navbar || !backToTopBtn) return;

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const currentScrollY = window.scrollY;

                        if (currentScrollY > lastScrollY && currentScrollY > 100) {
                            navbar.classList.add('hidden');
                        } else {
                            navbar.classList.remove('hidden');
                        }

                        if (currentScrollY > 500) {
                            backToTopBtn.classList.add('visible');
                        } else {
                            backToTopBtn.classList.remove('visible');
                        }

                        lastScrollY = currentScrollY;
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initScrollHandlers();
        });
    </script>
</body>
</html>
